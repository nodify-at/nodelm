[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nodelm"
version = "0.1.0"
description = "Reproducible research tooling for a TypeScript and Node.js specialist model"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "NodeLM contributors" }]
dependencies = [
  "datasets>=5.0.1,<6",
  "datasketch>=2.0,<2.1",
  "huggingface-hub>=1.28,<2",
  "psutil>=7.2.2,<8",
  "pyarrow>=25.0.1,<26",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.15,<3",
  "pyyaml>=6.0.2,<7",
  "structlog>=26.1,<27",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
training = [
  "accelerate>=1.14,<1.15",
  "peft>=0.20,<0.21",
  "torch>=2.13,<2.14",
  "transformers>=5.15,<5.16",
  "trl>=1.10,<1.11",
]

[project.scripts]
nodelm = "nodelm.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-psutil>=7,<8",
  "types-pyyaml>=6.0.12.20240917,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nodelm"]

[tool.uv]
exclude-newer = "2026-08-24T00:00:00Z"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --disable-warnings"
testpaths = ["tests"]
markers = [
  "integration: tests that exercise multiple NodeLM layers",
  "network: tests that require external network access",
  "training: tests that require optional training dependencies",
]

[tool.coverage.run]
branch = true
source = ["nodelm"]
omit = [
  "src/nodelm/__main__.py",
  # Exercised by the real Linux/Runpod sandbox probe; macOS cannot chroot or load Linux seccomp.
  "src/nodelm/evaluation/chroot_launcher.py",
  "src/nodelm/training/transformers_backend.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/nodelm/cli.py" = ["B008"]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["nodelm"]
warn_unreachable = true
